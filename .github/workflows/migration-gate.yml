name: Migration gate

# 새 마이그레이션이 있는 PR은 "운영 DB에 SQL을 먼저 적용했다"는 라벨(sql-applied)이 있어야 통과한다.
# 이 코드는 머지하면 곧바로 운영에 배포되고, 새 열·테이블을 읽는 화면은 SQL이 없으면 열리지 않는다.
# 라벨은 SQL을 운영 Supabase에 적용한 사람이 직접 붙인다. 라벨을 붙이거나 떼면 이 검사가 다시 돈다.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  migration-gate:
    name: migration gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check migrations against production
        env:
          BASE_REF: ${{ github.base_ref }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'sql-applied') }}
        run: |
          set -euo pipefail
          range="origin/${BASE_REF}...HEAD"

          # 이미 적용된 마이그레이션 파일은 고치거나 지우지 않는다(새 파일로 추가한다).
          changed="$(git diff --name-only --diff-filter=MDR "$range" -- 'supabase/migrations/*.sql')"
          if [ -n "$changed" ]; then
            echo "::error::기존 마이그레이션 파일을 수정·삭제·이름변경했습니다. 스키마 변경은 새 마이그레이션 파일로 추가하세요."
            echo "$changed"
            exit 1
          fi

          added="$(git diff --name-only --diff-filter=A "$range" -- 'supabase/migrations/*.sql')"
          if [ -z "$added" ]; then
            echo "새 마이그레이션 없음 — 통과"
            exit 0
          fi

          echo "새 마이그레이션:"
          echo "$added"
          if [ "$HAS_LABEL" = "true" ]; then
            echo "sql-applied 라벨 확인 — 통과"
            exit 0
          fi
          echo "::error::새 마이그레이션이 있습니다. 운영 Supabase에 위 SQL을 적용한 뒤 PR에 'sql-applied' 라벨을 붙이세요(라벨을 붙이면 이 검사가 다시 돕니다)."
          exit 1
